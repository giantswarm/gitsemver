version: 2.1
orbs:
  architect: giantswarm/architect@8.2.2

workflows:
  build:
    jobs:
      - architect/go-test:
          name: go-test
          # Needed to trigger job also on git tag.
          filters:
            # Trigger job also on git tag.
            tags:
              only: /^v.*/
      - architect/go-build:
          binary: gitrepo-version
          architectures: "linux/amd64,linux/arm64"
          context: architect
          requires:
            - go-test
